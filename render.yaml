# =============================================================================
# Render Blueprint — Astygma Hope Clinic Backend
# Deploy this web service, then set the env vars in the Render dashboard.
# Docs: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  # --- Backend API Web Service ---
  - type: web
    name: astygma-hope-clinic-backend
    runtime: node
    rootDir: server
    plan: free
    healthCheckPath: /health
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
        # Supabase PostgreSQL connection string — set manually in Render dashboard:
        # postgresql://postgres:YOUR_PASSWORD@db.gcqawwsopkbsednwzgph.supabase.co:5432/postgres
      - key: JWT_SECRET
        sync: false
        # Generate a long random string, set in Render dashboard.
      - key: CLIENT_URL
        sync: false
        # Comma-separated frontend origins:
        # https://your-project.pages.dev
        # (add http://localhost:3000 for local testing if needed)
      - key: JWT_EXPIRES_IN
        value: 7d
