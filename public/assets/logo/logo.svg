<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Top Sun/Head Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F29F38"/>
      <stop offset="100%" stop-color="#E27D28"/>
    </linearGradient>
    
    <!-- Muted Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55A8AD"/>
      <stop offset="100%" stop-color="#3B8B90"/>
    </linearGradient>

    <!-- Lime Green Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A1D348"/>
      <stop offset="100%" stop-color="#80B82D"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="200" cy="205" r="165" fill="none" stroke="#1E2A5A" stroke-width="16" />

  <!-- Left Muted Teal Shape -->
  <path d="M 50,205 A 150,150 0 0,1 180,60 C 140,110 110,160 100,220 C 70,270 55,240 50,205 Z" fill="url(#tealGrad)" />

  <!-- Bottom Magenta Arc -->
  <path d="M 75,300 C 110,340 160,355 200,355 C 160,355 120,335 90,310 Z" fill="#832675" />

  <!-- Right Lime Green Figure -->
  <path d="M 200,355 C 270,355 350,300 350,205 C 350,230 330,290 260,330 C 220,350 180,330 160,310 Z" fill="url(#greenGrad)" />
  <path d="M 230,210 C 280,210 345,230 350,205 C 345,290 280,340 220,335 C 240,290 250,240 230,210 Z" fill="url(#greenGrad)" />

  <!-- Inner Magenta Circle (Child / Figure Head) -->
  <circle cx="280" cy="180" r="32" fill="#832675" />

  <!-- S-Curve Brown Line -->
  <path d="M 80,120 Q 200,140 185,200 T 235,325" fill="none" stroke="#4A2A1A" stroke-width="8" stroke-linecap="round" />

  <!-- Green Swoop & Check Ribbon -->
  <path d="M 60,85 C 150,90 190,140 160,210 C 145,245 130,240 145,220 C 170,170 230,120 370,105" fill="none" stroke="#8DC63F" stroke-width="10" stroke-linecap="round" />
  <!-- Small Check Tip -->
  <path d="M 140,225 L 130,235 L 142,215" fill="none" stroke="#8DC63F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Top Sun/Head Circle -->
  <circle cx="200" cy="80" r="38" fill="url(#sunGrad)" stroke="#1E2A5A" stroke-width="6" />

</svg>
